<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>취미 찾기 | 나에게 딱 맞는 취미생활 추천</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header -->
  <header class="navbar">
    <div class="container nav-inner">
      <a href="#" class="logo" id="logoBtn">
        <span class="logo-icon">✨</span>
        <span class="logo-text">Hobby<span>Finder</span></span>
      </a>
      <div class="nav-actions">
        <button class="btn-secondary" id="randomRecommendBtn" title="무작위로 취미를 추천받아요">
          🎲 오늘의 랜덤 추천
        </button>
        <button class="btn-saved" id="savedDrawerBtn">
          ❤️ 찜한 취미 <span class="badge-count" id="savedCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="container hero-inner">
      <span class="hero-tag">맞춤형 취미 큐레이션</span>
      <h1>어떤 분야에 관심이 있으신가요?</h1>
      <p>관심 있는 대분류와 성향 필터를 선택하면 나에게 꼭 맞는 세부 취미활동을 추천해 드립니다.</p>

      <!-- Search Bar -->
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="취미 이름, 태그, 키워드 검색 (예: 러닝, 코딩, 캠핑, 베이킹...)" />
        <button class="clear-search" id="clearSearchBtn" hidden>✕</button>
      </div>
    </div>
  </section>

  <!-- Main Content -->
  <main class="container main-content">
    <!-- Step 1: Main Categories -->
    <section class="category-section" aria-label="대분류 선택">
      <div class="section-header">
        <h2>1. 관심 분야 선택 <span class="sub-hint">(중복 선택 가능)</span></h2>
        <button class="text-btn" id="resetCategoryBtn">전체 보기</button>
      </div>
      <div class="category-grid" id="categoryGrid">
        <!-- Rendered by JS -->
      </div>
    </section>

    <!-- Step 2: Sub-filters -->
    <section class="filter-section" aria-label="세부 조건 필터">
      <div class="filter-bar">
        <div class="filter-group">
          <span class="filter-label">장소</span>
          <div class="chip-group" data-filter="place">
            <button class="chip active" data-value="all">전체</button>
            <button class="chip" data-value="실내">🏠 실내</button>
            <button class="chip" data-value="실외">🌳 실외</button>
            <button class="chip" data-value="무관">🌐 장소무관</button>
          </div>
        </div>

        <div class="filter-group">
          <span class="filter-label">인원</span>
          <div class="chip-group" data-filter="social">
            <button class="chip active" data-value="all">전체</button>
            <button class="chip" data-value="혼자">🧘 혼자서</button>
            <button class="chip" data-value="함께">👫 함께/모임</button>
          </div>
        </div>

        <div class="filter-group">
          <span class="filter-label">초기 비용</span>
          <div class="chip-group" data-filter="cost">
            <button class="chip active" data-value="all">전체</button>
            <button class="chip" data-value="무료~저렴">💸 무료~저렴</button>
            <button class="chip" data-value="보통">💳 보통</button>
            <button class="chip" data-value="다소 높음">💎 장비 필요</button>
          </div>
        </div>

        <div class="filter-group">
          <span class="filter-label">활동 에너지</span>
          <div class="chip-group" data-filter="energy">
            <button class="chip active" data-value="all">전체</button>
            <button class="chip" data-value="정적">🍵 정적/힐링</button>
            <button class="chip" data-value="보통">🚶 보통</button>
            <button class="chip" data-value="활동적">🔥 활동적</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Results Section -->
    <section class="results-section">
      <div class="results-header">
        <div class="results-title-wrap">
          <h2 id="resultsHeading">전체 세부 취미 추천</h2>
          <span class="results-count" id="resultsCount">0개</span>
        </div>
        <div class="results-controls">
          <button class="btn-reset-all" id="resetAllBtn" hidden>필터 초기화 ↺</button>
          <select id="sortSelect" class="sort-select" aria-label="정렬 기준">
            <option value="popular">인기 추천순</option>
            <option value="easy">입문 쉬운순</option>
            <option value="cheap">비용 저렴한순</option>
            <option value="name">가나다순</option>
          </select>
        </div>
      </div>

      <!-- Hobby Cards Grid -->
      <div class="hobby-grid" id="hobbyGrid">
        <!-- Rendered by JS -->
      </div>

      <!-- Empty State -->
      <div class="empty-state" id="emptyState" hidden>
        <div class="empty-icon">🧐</div>
        <h3>조건에 맞는 취미를 찾지 못했어요</h3>
        <p>선택한 필터나 검색어를 조금 넓혀서 다시 탐색해 보세요!</p>
        <button class="btn-primary" id="emptyResetBtn">모든 필터 초기화</button>
      </div>
    </section>
  </main>

  <!-- Detail Modal -->
  <div class="modal-backdrop" id="detailModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="closeModalBtn" aria-label="닫기">✕</button>
      <div id="modalBody">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>© 2026 HobbyFinder · 오늘 시작하는 작은 즐거움</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
